name: Notification Discord

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Notifier Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLOG_BASE_URL: ${{ secrets.BLOG_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Mode test manuel — tous les articles avec frontmatter."
            files=$(find blog -maxdepth 1 -name '*.md' -type f 2>/dev/null || true)
          else
            base="${{ github.event.pull_request.base.sha }}"
            merge="${{ github.event.pull_request.merge_commit_sha }}"
            files=$(git diff --name-only "$base" "$merge" -- 'blog/*.md' 2>/dev/null || true)
          fi

          if [ -z "$files" ]; then
            echo "Aucun fichier blog/*.md trouvé."
            exit 0
          fi

          node script/discord-notify.js $files
