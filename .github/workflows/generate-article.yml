name: Génération article IA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer les articles Markdown vides
        id: gen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          generated=0

          echo "📋 Fichiers modifiés :"
          git show --name-only --pretty=format: ${{ github.event.pull_request.head.sha }} -- 'blog/*.md' || echo "Aucun fichier trouvé"

          for file in $(git show --name-only --pretty=format: ${{ github.event.pull_request.head.sha }} -- 'blog/*.md' 2>/dev/null || true); do
            echo "📝 Traitement : $file"
            if [ ! -s "$file" ]; then
              echo "✅ Fichier vide, génération..."
              node script/generate.js "$file" || echo "❌ Erreur génération"
              generated=1
            else
              echo "⏭️  Fichier non vide"
            fi
          done

          echo "generated=$generated" >> "$GITHUB_OUTPUT"

      - name: Commit et push les articles générés
        if: steps.gen.outputs.generated == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*.md
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore(ci): article généré par IA [skip ci]"
          git push

      - name: Upload artefact articles générés
        uses: actions/upload-artifact@v4
        with:
          name: generated-articles-${{ github.event.pull_request.number }}
          path: blog/
          if-no-files-found: warn
          retention-days: 14

      - name: Préparer le commentaire PR
        run: |
          files=$(git diff --name-only origin/main...HEAD -- 'blog/*.md' 2>/dev/null || true)
          node script/build-pr-comment.js $files > .github/pr-comment.md

      - name: Commenter la PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: .github/pr-comment.md
          body-includes: "<!-- codechronicle-bot -->"
